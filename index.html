<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barra de navegación</title>
</head>
<body>
    
    <nav class="bg-gray-800 p-5">
        
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="/img/logo.jpg" alt="logo" class="w-20 h-20">
                <h2 class="text-white text-xl font-bold">
                    Café el trébol
                </h2>
            </div>

            <!-- Botón hamburguesa para móvil -->
            <button id="menu-btn" class="md:hidden text-white text-2xl focus:outline-none">
                ☰
            </button>

            <!-- Menú de navegación -->
            <ul id="menu" class="hidden md:flex flex-col md:flex-row space-x-0 md:space-x-4 text-white absolute md:static top-16 left-0 w-full md:w-auto bg-gray-800 p-4 md:p-0 z-10">
                <li><a href="#" class="hover:underline block py-2 md:py-0">Inicio</a></li>
                <li><a href="#" class="hover:underline block py-2 md:py-0">Productos</a></li>
                <li><a href="#" class="hover:underline block py-2 md:py-0">Contacto</a></li>
                <li><a href="#" class="text-green-700 border-1 border-green-700 block py-2 md:py-0">Ordenar ahora</a></li>
            </ul>
        </div>

    </nav>

    <script>
        // Función para alternar el menú
        const menuBtn = document.getElementById('menu-btn');
        const menu = document.getElementById('menu');

        menuBtn.addEventListener('click', () => {
            menu.classList.toggle('hidden');
        });
    </script>
</body>
</html>
